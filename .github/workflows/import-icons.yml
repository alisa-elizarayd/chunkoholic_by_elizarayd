name: Import legacy app icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy icons from the clean legacy frontend
        run: |
          mkdir -p icons
          curl -fL --retry 3 -o icons/icon-192.png https://raw.githubusercontent.com/alisa-elizarayd/chunkoholic/main/icons/icon-192.png
          curl -fL --retry 3 -o icons/icon-512.png https://raw.githubusercontent.com/alisa-elizarayd/chunkoholic/main/icons/icon-512.png
          file icons/icon-192.png icons/icon-512.png

      - name: Commit icons and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          git commit -m "Add app icons"
          git push

          git rm .github/workflows/import-icons.yml
          git commit -m "Remove temporary icon import workflow"
          git push
